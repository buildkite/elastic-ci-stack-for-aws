# Test branch only: exercise the PR's real builders without publishing images.
steps:
  - key: packer-base-windows-amd64
    label: ":packer: :windows: Base SSM connectivity test"
    command: .buildkite/steps/packer.sh windows amd64 base
    timeout_in_minutes: 45
    env:
      AMI_PUBLIC: false
      PKR_VAR_iam_instance_profile: "packer-ssm"
    agents:
      queue: "${BUILDKITE_AGENT_META_DATA_QUEUE}"
    plugins:
      - &aws_role_plugin
        aws-assume-role-with-web-identity#v1.8.1:
          role-arn: arn:aws:iam::172840064832:role/pipeline-buildkite-aws-stack-buildkite-aws-stack
          session-tags:
            - organization_slug
            - organization_id
            - pipeline_slug

  - key: packer-windows-amd64
    label: ":packer: :windows: Final-image SSM connectivity test"
    command: .buildkite/steps/packer.sh windows
    depends_on: packer-base-windows-amd64
    timeout_in_minutes: 60
    env:
      AMI_PUBLIC: false
      PKR_VAR_iam_instance_profile: "packer-ssm"
    agents:
      queue: "${BUILDKITE_AGENT_META_DATA_QUEUE}"
    plugins:
      - *aws_role_plugin
